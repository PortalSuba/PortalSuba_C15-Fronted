# SonarQube Cloud: organizacion portalsuba (https://sonarcloud.io/organizations/portalsuba)
sonar.organization=portalsuba
sonar.projectKey=PortalSuba_PortalSuba_C15-Fronted
sonar.projectName=PortalSuba_C15-Fronted
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**,src/test/**
sonar.exclusions=src/**/__tests__/**,src/test/**

# Cobertura de Vitest (npm run coverage -> coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Punto de entrada que solo monta la app
sonar.coverage.exclusions=src/main.jsx
